[project]
name = "agentguard-api"
version = "0.1.0"
description = "AgentGuard API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "arq>=0.26.3",
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.32",
  "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.3",
]

[tool.setuptools.packages.find]
include = ["agentguard_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
