services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
    ports:
      - "5432:5432"
    volumes:
      - agentguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      AGENTGUARD_DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@postgres:5432/agentguard
      AGENTGUARD_API_HOST: 0.0.0.0
      AGENTGUARD_API_PORT: 8000
      AGENTGUARD_MAX_TRACE_SPANS: 500
      AGENTGUARD_MAX_INGESTION_BYTES: 1048576
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    environment:
      AGENTGUARD_API_URL: http://api:8000
      NEXT_PUBLIC_AGENTGUARD_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  agentguard-postgres:
