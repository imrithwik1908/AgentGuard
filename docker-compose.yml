services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentguard
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
    ports:
      - "${AGENTGUARD_POSTGRES_PORT:-55432}:5432"
    volumes:
      - agentguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard -d agentguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${AGENTGUARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      AGENTGUARD_DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@postgres:5432/agentguard
      AGENTGUARD_API_HOST: 0.0.0.0
      AGENTGUARD_API_PORT: 8000

      AGENTGUARD_ENVIRONMENT: production
      AGENTGUARD_AUTH_REQUIRED: "true"
      AGENTGUARD_EVALUATION_QUEUE_BACKEND: redis
      AGENTGUARD_REDIS_URL: redis://redis:6379/0
      AGENTGUARD_EMBEDDED_WORKER_ENABLED: ${AGENTGUARD_EMBEDDED_WORKER_ENABLED:-false}

      AGENTGUARD_MAX_TRACE_SPANS: 500
      AGENTGUARD_MAX_INGESTION_BYTES: 1048576

      AGENTGUARD_EVALUATION_JOB_TIMEOUT_SECONDS: 300
      AGENTGUARD_EVALUATION_WORKER_CONCURRENCY: 4

      AGENTGUARD_LLM_JUDGE_SCORE_TOLERANCE: 0.05

      AGENTGUARD_JUDGE_PROVIDER: ${AGENTGUARD_JUDGE_PROVIDER:-disabled}
      AGENTGUARD_JUDGE_BASE_URL: ${AGENTGUARD_JUDGE_BASE_URL:-https://api.openai.com/v1}
      AGENTGUARD_JUDGE_API_KEY: ${AGENTGUARD_JUDGE_API_KEY:-}
      AGENTGUARD_JUDGE_MODEL: ${AGENTGUARD_JUDGE_MODEL:-gpt-4o-mini}

      AGENTGUARD_DEMO_SEED_ENABLED: ${AGENTGUARD_DEMO_SEED_ENABLED:-true}

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./apps/api
    command: ["arq", "agentguard_api.worker.WorkerSettings"]

    environment:
      AGENTGUARD_DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@postgres:5432/agentguard

      AGENTGUARD_ENVIRONMENT: production
      AGENTGUARD_AUTH_REQUIRED: "true"
      AGENTGUARD_EVALUATION_QUEUE_BACKEND: redis
      AGENTGUARD_REDIS_URL: redis://redis:6379/0

      AGENTGUARD_EVALUATION_JOB_TIMEOUT_SECONDS: 300
      AGENTGUARD_EVALUATION_WORKER_CONCURRENCY: 4

      AGENTGUARD_LLM_JUDGE_SCORE_TOLERANCE: 0.05

      AGENTGUARD_JUDGE_PROVIDER: ${AGENTGUARD_JUDGE_PROVIDER:-disabled}
      AGENTGUARD_JUDGE_BASE_URL: ${AGENTGUARD_JUDGE_BASE_URL:-https://api.openai.com/v1}
      AGENTGUARD_JUDGE_API_KEY: ${AGENTGUARD_JUDGE_API_KEY:-}
      AGENTGUARD_JUDGE_MODEL: ${AGENTGUARD_JUDGE_MODEL:-gpt-4o-mini}

    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      context: ./apps/web

    environment:
      AGENTGUARD_API_URL: http://api:8000
      AGENTGUARD_DEMO_SEED_ENABLED: ${AGENTGUARD_DEMO_SEED_ENABLED:-true}

    ports:
      - "3000:3000"

    depends_on:
      api:
        condition: service_healthy

volumes:
  agentguard-postgres:
